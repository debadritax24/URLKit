<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URLKit — Shorten Links Beautifully</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="app">
      <div class="card glass">
        <header class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="brand-text">
            <h1>URLKit</h1>
            <p class="subtitle">Shorten links. Share faster.</p>
          </div>
        </header>

        <form id="shortenForm" class="shorten-form" novalidate>
          <div class="input-group">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path
                  d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <input
                type="url"
                id="urlInput"
                placeholder="Paste a long URL here…"
                required
                aria-label="URL to shorten"
                autocomplete="url"
                spellcheck="false"
              />
            </div>
          </div>

          <div class="options-toggle">
            <button type="button" id="optionsToggle" class="toggle-btn" aria-expanded="false" aria-controls="optionsPanel">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Customize short link</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <div id="optionsPanel" class="options-panel" hidden>
            <label for="customCode" class="custom-label">
              <span class="label-text">Custom short code</span>
              <span class="label-hint">3–30 chars · letters, numbers, -, _</span>
            </label>
            <div class="custom-input-wrap">
              <span class="prefix" id="prefixLabel">urlkit.io/</span>
              <input
                type="text"
                id="customCode"
                placeholder="my-link"
                maxlength="30"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="customCodeHint"
              />
            </div>
            <p id="customCodeHint" class="hint-text"></p>
          </div>

          <button type="submit" id="submitBtn" class="submit-btn">
            <span class="btn-text">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
              Shorten URL
            </span>
            <span class="btn-loading" aria-hidden="true">
              <span class="spinner"></span>
              Shortening…
            </span>
          </button>
        </form>

        <div id="result" class="result-area" aria-live="polite"></div>
      </div>

      <footer class="footnote">
        <span>Made with precision · Links expire after 30 days</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast-icon" aria-hidden="true">✓</span>
      <span class="toast-text">Copied!</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
